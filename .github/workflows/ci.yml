name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Compliance grep (banned strings, Form copy law)
        run: npm run compliance:grep
      - name: Unit + compliance tests
        run: npm test
      - name: Build
        run: npm run build
